quarkus.analytics.disabled=true

quarkus.console.color=true

# Banner wurde erstellt mit: http://www.network-science.de/ascii (Font: standard)
quarkus.banner.path=my.banner

# LOGGING
quarkus.log.level=INFO

quarkus.log.console.enable=true
quarkus.log.socket.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c] (%t) %s%e%n

# Wicket / GUI
# Arc entfernt sonst beans die keinen InjectionPoint haben.
# Wenn wir mit Wicket aber programmatischen Lookup machen wollen, dann brauchen wir die Einstellung.
quarkus.arc.remove-unused-beans=false
